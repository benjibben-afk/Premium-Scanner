name: premium scan

on:
  workflow_dispatch:      # the "Run workflow" button, and how the scanner restarts itself
  schedule:
    # Backup only: revives the chain on weekday mornings if it ever stops.
    - cron: "5 13 * * 1-5"
    - cron: "35 14 * * 1-5"

permissions:
  contents: write
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan every 30 minutes while the market is open
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "cc-scanner"
          git config user.email "scanner@users.noreply.github.com"
          python -u loop.py
